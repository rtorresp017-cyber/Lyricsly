<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Lyricly</title><link rel="stylesheet" href="styles.css"></head><body><main>
<header><div><small>YOUR MUSIC</small><h1>♪ Lyricly</h1></div><button id="donate">♡ Donate</button></header>
<form id="form"><input id="q" placeholder="Search songs or artists..."><button>Search</button></form><p id="status"></p><section id="results"></section>
<section id="songView" class="hidden"><button id="back">← Back</button><div class="songhead"><img id="cover"><div><small>NOW PLAYING</small><h2 id="title"></h2><p id="artist"></p></div></div>
<div class="tabs"><button class="tab active" data-tab="lyricsPane">Lyrics</button><button class="tab" data-tab="chordsPane">Guitar</button></div>
<div id="lyricsPane" class="pane">
<div class="scrollbar"><button id="autoScroll">▶ Auto Scroll</button><label>Speed <input id="speed" type="range" min="1" max="10" value="4"></label><button id="top">↟ Top</button></div>
<pre id="lyricsText">Loading lyrics…</pre></div>
<div id="chordsPane" class="pane hidden"><div class="real-tab"><small>SONGSTERR TAB</small><h3>Real guitar tab search</h3><p id="tabMeta"></p><a id="tabLink" class="primary" target="_blank" rel="noopener">Open Full Tab ↗</a></div></div>
</section>
<div id="modal" class="modal hidden"><div class="card"><button id="close">×</button><h2>Support Lyricly ♡</h2><p>Donate through Zelle</p><strong>714-818-7485</strong><button id="copy">Copy Zelle number</button></div></div>
</main><script src="app.js"></script></body></html>
