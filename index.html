<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>Lyricly — Lyrics Search</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <section id="homeView" class="view active">
      <header class="topbar">
        <div>
          <p class="eyebrow">YOUR MUSIC</p>
          <h1><span class="note">♪</span> Lyricly</h1>
        </div>
        <button class="icon-btn" id="favoritesShortcut" aria-label="Open favorites">♡</button>
      </header>

      <form id="searchForm" class="search-wrap">
        <span>⌕</span>
        <input id="searchInput" autocomplete="off" placeholder="Search songs or artists..." />
        <button id="clearSearch" type="button" aria-label="Clear search">×</button>
      </form>

      <div id="status" class="status hidden"></div>

      <section id="resultsSection" class="section hidden">
        <div class="section-head">
          <h2>Search results</h2>
          <span id="resultCount"></span>
        </div>
        <div id="results" class="song-list"></div>
      </section>

      <section id="recentSection" class="section">
        <div class="section-head">
          <h2>Recent searches</h2>
          <button id="clearRecent" class="text-btn">Clear</button>
        </div>
        <div id="recentList" class="song-list empty-state">
          <p>Your recent songs will appear here.</p>
        </div>
      </section>
    </section>

    <section id="favoritesView" class="view">
      <header class="page-header">
        <button class="back-btn" data-back="homeView">‹</button>
        <div>
          <p class="eyebrow">YOUR COLLECTION</p>
          <h2>Saved lyrics</h2>
        </div>
      </header>
      <div id="favoritesList" class="song-list empty-state">
        <p>Tap ♡ on a song to save it here.</p>
      </div>
    </section>

    <section id="lyricsView" class="view">
      <header class="lyrics-header">
        <button class="back-btn" id="lyricsBack">‹</button>
        <button class="icon-btn" id="favoriteButton" aria-label="Save song">♡</button>
      </header>

      <div class="now-playing">
        <img id="lyricsCover" alt="" />
        <div>
          <p class="eyebrow">NOW READING</p>
          <h2 id="lyricsTitle">Song title</h2>
          <p id="lyricsArtist">Artist</p>
        </div>
      </div>

      <div class="lyrics-card">
        <div class="lyrics-card-head">
          <h3>Lyrics</h3>
          <button id="copyLyrics" class="text-btn">Copy</button>
        </div>
        <pre id="lyricsText">Loading lyrics…</pre>
      </div>
    </section>

    <nav class="bottom-nav">
      <button class="nav-item active" data-view="homeView"><span>⌂</span>Home</button>
      <button class="nav-item" data-view="favoritesView"><span>♡</span>Saved</button>
      <button class="nav-item" id="focusSearch"><span>⌕</span>Search</button>
    </nav>
  </main>

  <template id="songTemplate">
    <button class="song-row">
      <img class="cover" alt="" />
      <span class="song-copy">
        <strong class="song-title"></strong>
        <small class="song-artist"></small>
      </span>
      <span class="chevron">›</span>
    </button>
  </template>

  <script src="app.js"></script>
</body>
</html>
